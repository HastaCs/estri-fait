<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>smoke</title>
  <style>html,body{margin:0;height:100%;background:#000}</style>
  <script>
    window.__errors = [];
    window.onerror = function (msg, src, line, col) {
      window.__errors.push(String(msg) + ' @' + (src || '') + ':' + line + ':' + col);
    };
    window.addEventListener('unhandledrejection', function (e) {
      window.__errors.push('promise: ' + e.reason);
    });
  </script>
</head>
<body>
  <div id="game"></div>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
  <script src="js/characters.js"></script>
  <script src="js/backgrounds.js"></script>
  <script src="js/scenes/GameScene.js"></script>
  <script src="js/scenes/SelectScene.js"></script>
  <script src="js/scenes/BackgroundScene.js"></script>
  <script>
    (function () {
      var _G = Phaser.Game;
      Phaser.Game = function (cfg) {
        var g = new _G(cfg);
        window.game = g;
        return g;
      };
    })();
  </script>
  <script src="js/main.js"></script>
  <script>
    function status(key) {
      if (!window.game) return -1;
      var s = window.game.scene.getScenes(false).find(function (x) { return x.scene.key === key; });
      return s ? s.sys.settings.status : -1;
    }
    window.__status = function () {
      return 'SEL=' + status('SelectScene') + ' BG=' + status('BackgroundScene') +
        ' GAME=' + status('GameScene') + ' ERR=' + window.__errors.length;
    };
    var phase = 0;
    setInterval(function () {
      if (!window.game) return;
      if (phase === 0 && status('SelectScene') === 5) {
        phase = 1;
        window.game.scene.start('BackgroundScene', { p1: 0, p2: 1 });
      } else if (phase === 1 && status('BackgroundScene') === 5) {
        phase = 2;
        window.game.scene.start('GameScene', { p1: 0, p2: 1, bg: 0 });
      } else if (phase === 2 && status('GameScene') === 5) {
        phase = 3;
        window.__phase = 3;
      }
    }, 100);
  </script>
</body>
</html>
